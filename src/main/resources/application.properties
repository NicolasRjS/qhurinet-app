spring.application.name=qhurinet
spring.profiles.default=local
server.port=${PORT:8088}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_qhurinet}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql
logging.level.root=INFO
logging.level.com.upc.qhurinet=INFO
logging.file.name=${LOG_FILE:logs/api.log}
spring.web.error.include-stacktrace=never
ip.frontend=${FRONTEND_URL:http://localhost:4200}
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
jwt.secret=${JWT_SECRET}
almacenamiento.ruta=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
soporte.telefono=${SUPPORT_PHONE:}
soporte.horario=${SUPPORT_HOURS:}
rutas.osrm.url=${OSRM_URL:https://router.project-osrm.org}
disponibilidad.franjas=manana,tarde,noche
seguimiento.caducidad-segundos=120
ia.api-key=${GEMINI_API_KEY:}
ia.modelo=${GEMINI_MODEL:}
ia.url=${GEMINI_URL:https://generativelanguage.googleapis.com}
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.facebook.app-id=${FACEBOOK_APP_ID:}
oauth.facebook.app-secret=${FACEBOOK_APP_SECRET:}
oauth.facebook.version=${FACEBOOK_API_VERSION:v23.0}
correo.modo=${MAIL_MODE:smtp}
correo.remitente=${MAIL_FROM:}
correo.verificacion-url=${VERIFICATION_URL:http://localhost:4200/verify-email}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
