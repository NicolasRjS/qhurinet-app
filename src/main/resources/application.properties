spring.application.name=qhurinet
server.port=8088
spring.datasource.url=jdbc:postgresql://localhost:5432/db_qhurinet
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuración de Logs en consola y archivo
logging.level.root=INFO
logging.level.com.upc.qhurinet=info
logging.file.name=logs/api.log
#Evitando enviar el trace al cliente
spring.web.error.include-stacktrace=never

# Datos iniciales (data.sql): se ejecutan en cada arranque, despues de que Hibernate crea las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

ip.frontend=http://localhost:4200

# Fechas de los parametros de consulta en formato ISO (yyyy-MM-dd y yyyy-MM-ddTHH:mm:ss)
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

jwt.secret=v35XSXF/s2iRGlI0PO8Z1jY0Lwrs1/AL3Z0GIArhhnD5GeM/W6GVZvYiMBT49uhmec9bI5ML2cZ1Rvp22kZdrw==

# Carga de archivos: carpeta local donde se guardan y tamaño maximo por archivo
almacenamiento.ruta=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

